    <style>
        * {
            margin: 0;
            padding: 0;

            font-family: 'Segoe UI', sans-serif;

        body {

            background: linear-gradient(135deg, #667eea, #764ba2);

        .container {
            width: 90%;
            max-width: 600px;

        }

        h4 {
            margin-bottom: 20px;
            color: #777;
        }

        hr {
            margin-bottom: 20px;
        }

        .links {
            display: grid;
            gap: 12px;
        }

        a {
            text-decoration: none;
            padding: 12px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border-radius: 8px;
            font-weight: 500;
            transition: 0.3s;
        }

        a:hover {
            transform: scale(1.05);
            background: linear-gradient(135deg, #5a6fd6, #6a3fa0);
        }
    </style>
